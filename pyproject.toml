[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscanner-lite"
version = "1.0.0"
description = "Bounded HTTP security posture auditor for authorized targets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Muhammet0-1"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
vulnscanner-lite = "vulnscanner_lite.cli:main"

[project.urls]
Homepage = "https://github.com/Muhammet0-1/VulnScannerLite"
Issues = "https://github.com/Muhammet0-1/VulnScannerLite/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vulnscanner_lite = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "scanner.py"]
