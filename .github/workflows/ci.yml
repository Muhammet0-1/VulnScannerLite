name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: python -m compileall -q src tests scanner.py
      - run: python -m build
      - name: Validate distributions
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")
          sdist = glob.glob("dist/*.tar.gz")
          assert len(wheel) == len(sdist) == 1
          with zipfile.ZipFile(wheel[0]) as archive:
              names = archive.namelist()
              assert "vulnscanner_lite/cli.py" in names
              assert "vulnscanner_lite/py.typed" in names
              assert not any("/tests/" in name or "__pycache__" in name for name in names)
              archive.testzip()
          with tarfile.open(sdist[0]) as archive:
              names = archive.getnames()
              assert any(name.endswith("/scanner.py") for name in names)
              assert any(name.endswith("/tests/conftest.py") for name in names)
              assert not any("__pycache__" in name or "/.venv/" in name for name in names)
          PY
      - run: vulnscanner-lite --version
